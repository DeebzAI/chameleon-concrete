# Builds the static export of `web/` and deploys it to GitHub Pages.
# Triggers: every push to main, or manual run from the Actions tab.
#
# This uses the modern Pages flow (artifact + deploy-pages), NOT the
# old gh-pages branch pattern. Repo Settings → Pages → Source must be
# set to "GitHub Actions" for this workflow to actually publish.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by `actions/deploy-pages@v4`. `id-token: write`
# is for OIDC; `pages: write` lets the action publish; `contents: read`
# is the default repo checkout permission.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel in-flight ones if a newer
# push lands so we don't ship stale builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # GITHUB_REPOSITORY is auto-populated by Actions (e.g.
        # "username/chameleon-concrete"). next.config.mjs reads it to
        # set basePath = "/chameleon-concrete".
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
